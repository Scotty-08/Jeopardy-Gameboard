<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboards</title>
  <link rel="stylesheet" href="../assets/hub.css">
  <link rel="stylesheet" href="../assets/leaderboard.css">
  <script src="../assets/hub.js" defer></script>
  <script src="leaderboard.js" defer></script>
</head>
<body>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="../index.html">Home</a>
    <a href="games.html">Games</a>
    <a href="leaderboard.html" aria-current="page">Leaderboard</a>
    <details class="info-menu">
      <summary>Info</summary>
      <div class="info-links">
        <a href="../author/authors.html">Creators</a>
        <a href="../faq/faq.html">FAQ</a>
      </div>
    </details>
  </nav>
  <main class="lb">
    <header class="leaderboard-header">
      <h1 class="title" id="pageTitle">Leaderboards</h1>
      <p class="sub">Scores are saved in this browser. Beat the top spot to earn the crown.</p>
    </header>
    <div class="tabs" id="tabs" role="tablist" aria-label="Choose a game"></div>
    <div class="lb-actions">
      <a class="btn gold" id="playGame" href="games.html">Play this game</a>
    </div>
    <table class="table" aria-live="polite">
      <thead>
        <tr id="tableHeader"></tr>
      </thead>
      <tbody id="leaderboard"></tbody>
    </table>
    <p class="empty" id="empty" hidden>No scores yet. Be the first!</p>
  </main>
</body>
</html>
