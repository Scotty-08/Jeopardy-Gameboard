<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Blitz</title>
  <link rel="stylesheet" href="../assets/hub.css">
  <link rel="stylesheet" href="../assets/blitz.css">
  <script src="../assets/hub.js" defer></script>
  <script src="blitz.js" defer></script>
</head>
<body>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="../index.html">Home</a>
    <a href="games.html">Games</a>
    <a href="leaderboard.html">Leaderboard</a>
    <details class="info-menu">
      <summary>Info</summary>
      <div class="info-links">
        <a href="../author/authors.html">Creators</a>
        <a href="../faq/faq.html">FAQ</a>
      </div>
    </details>
  </nav>

  <main class="blitz">
    <header class="hud" id="hud" hidden>
      <div class="stat"><span>Score</span><b id="score">0</b></div>
      <div class="stat time"><span id="timeLabel">Time</span><b id="time">60</b></div>
      <div class="stat"><span>Streak</span><b id="streak">0</b><em id="mult">x1</em></div>
    </header>
    <div class="bar" id="barWrap" hidden><i id="bar"></i></div>

    <section id="start" class="panel">
      <h1 id="modeTitle" class="title">Quiz Blitz</h1>
      <p id="modeText" class="lead"></p>
      <ul id="rules" class="rules"></ul>
      <button id="go" class="btn gold big" type="button">Start</button>
    </section>

    <div id="count" class="count" aria-live="assertive" hidden></div>

    <section id="play" class="panel" hidden>
      <span id="qCat" class="chip"></span>
      <h2 id="q"></h2>
      <div id="choices" class="choices" role="group" aria-label="Answer choices"></div>
    </section>

    <section id="end" class="panel end" hidden>
      <p class="kicker" id="endKicker">Time!</p>
      <h2 id="endScore" class="title">0</h2>
      <p class="lead" id="endNote"></p>
      <ul class="end-stats" id="endStats"></ul>
      <div class="actions">
        <button id="again" class="btn gold" type="button">Play again</button>
        <a id="endBoard" class="btn" href="leaderboard.html?game=blitz">Leaderboard</a>
        <a class="btn ghost" href="games.html">All games</a>
      </div>
    </section>
  </main>
</body>
</html>
